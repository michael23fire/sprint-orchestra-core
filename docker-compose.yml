services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    container_name: poc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: poc-kafka
    # Kafka can fatally exit on restart races (stale ZK broker registration) — always come back.
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: poc-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: postgres:15
    container_name: poc-postgres
    environment:
      POSTGRES_DB: pocdb
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Separate Postgres (with pgvector) owned by the vectorization-service. It keeps its own copy of
  # the text it embeds — fed by Kafka — so it never reaches into jira-backend's `postgres` tables.
  # The migration in vectorization-service/migrations is auto-applied on first init.
  vecdb:
    image: pgvector/pgvector:pg15
    container_name: poc-vecdb
    environment:
      POSTGRES_DB: vecdb
      POSTGRES_USER: vec
      POSTGRES_PASSWORD: vec123
    ports:
      - "5433:5432"
    volumes:
      - vecdb-data:/var/lib/postgresql/data
      # Postgres runs every *.sql in this dir, alphabetically, on first init only. Existing
      # containers need migrations applied by hand (see vectorization-service/README.md).
      - ./vectorization-service/migrations:/docker-entrypoint-initdb.d:ro

  # redis-stack-server (not plain redis:7): adds the RediSearch module, which ai-service's semantic
  # cache uses for native vector KNN search over cached-question embeddings (see
  # ai-service/app/cache/semantic_cache.py) instead of pulling every candidate into Python and
  # scanning — a real fix for the O(n) linear-scan limitation that module documented, not just a
  # relabeling. Wire-compatible superset of plain Redis, so nothing else that talks to this container
  # (e.g. Redis used for other future caching) needs to change.
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: poc-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: poc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Optional: one OpenAI-compatible gateway in front of every LLM backend this project talks to
  # (local LM Studio + production Anthropic) — centralized rate limiting, per-key spend budgets, and
  # model routing, distinct from what any single service's own LLMClient does. See
  # litellm-gateway/config.yaml and litellm-gateway/README.md. Not started by a plain `docker compose
  # up` (bring up explicitly with `--profile litellm`) since it's optional infrastructure, not
  # required for the core RAG/agent path to work.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: poc-litellm
    profiles: ["litellm"]
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://poc:poc123@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-local-master-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./litellm-gateway/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"  # so the container can reach LM Studio on the host (macOS/Windows Docker Desktop already resolves this; Linux needs this line)

volumes:
  postgres-data:
  vecdb-data:
  minio-data:
