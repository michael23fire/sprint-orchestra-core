[project]
name = "ai-service"
version = "0.1.0"
description = "Agentic RAG: corrective retrieval over vectorization-service's index via Claude tool use."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
