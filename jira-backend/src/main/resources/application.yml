server:
  # Backend listens here; Spring Cloud Gateway (subproject :gateway) uses 8080 and proxies to this port.
  port: 8081

spring:
  application:
    name: jira-agentic-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/pocdb
    username: poc
    password: poc123
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 若 DB 已有舊表、但還沒有 flyway_schema_history，可自動 baseline，略過 V1（需 schema 已與 migration 一致）
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate     # 由 Flyway 管理 schema；啟動時只驗證 Entity 與 DB 是否一致
    show-sql: true           # 印出 Hibernate 生成的 SQL，方便 debug
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 60000    # cache 60 秒後過期 (毫秒)

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # Kafka (producer). Match local brokers from docker-compose when enabling attachment ingestion below.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Publishes run on the request thread (AFTER_COMMIT listener). Default max.block.ms
        # is 60s — a dead broker would hold every attachment upload response hostage until
        # the gateway times out (503 fallback). Fail fast and just log the warning instead.
        max.block.ms: ${SPRING_KAFKA_PRODUCER_MAX_BLOCK_MS:2000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      # Keep the public management surface small. Prometheus scrapes the metrics endpoint;
      # deployment platforms use the health endpoints for liveness/readiness probes.
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: never
      probes:
        # Also expose /actuator/health/liveness and /actuator/health/readiness outside Kubernetes.
        enabled: true
  metrics:
    tags:
      application: jira-backend

app:
  kafka:
    # Publish after attachment upload (after DB commit). Payload is tracking-only for pipelines / POC.
    attachment-ingestion:
      enabled: ${APP_KAFKA_ATTACHMENT_INGESTION_ENABLED:true}
      topic: ${APP_KAFKA_ATTACHMENT_INGESTION_TOPIC:jira.attachment.ingestion}
    # Publish after issue/comment create/update/delete (after DB commit). Consumed by the
    # vectorization-service for RAG ingestion (chunk -> embed -> upsert into pgvector).
    #
    # **Found live, not hypothetically**: this defaulted to `false` while attachment-ingestion above
    # defaults to `true` -- an inconsistency, not a deliberate choice (nothing in this codebase ever
    # explains why content sync would be opt-in when it's the pipeline every other RAG feature and
    # sprint-recovery's real-time Kafka reevaluation trigger (app/sprint_recovery/kafka_trigger.py)
    # actually depend on). With it left at the default, this dev instance silently ran for a long time
    # with jira-backend writes never reaching vectorization-service's index at all -- every content
    # change needed a manual backfill script to become visible, indistinguishable from a real
    # regression. Defaulting to `true`, matching attachment-ingestion, so a fresh checkout/deploy has
    # working sync out of the box; the env var still lets an operator turn it off deliberately.
    content-ingestion:
      enabled: ${APP_KAFKA_CONTENT_INGESTION_ENABLED:true}
      topic: ${APP_KAFKA_CONTENT_INGESTION_TOPIC:jira.content.ingestion}

  # GitHub OAuth. Set GITHUB_OAUTH_ENABLED=true and OAuth app credentials from GitHub Developer settings.
  oauth2:
    github:
      enabled: ${GITHUB_OAUTH_ENABLED:false}
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      # Keep callback stable behind gateway/proxy to avoid GitHub redirect_uri mismatch.
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/github}
  frontend:
    # Where to send the browser after GitHub login (fragment carries JWT).
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  security:
    # Shared with the API gateway; only requests that include header X-Gateway-Internal with this value are accepted.
    internal-gateway-token: ${INTERNAL_GATEWAY_TOKEN:dev-internal-gateway-token-min-32-chars-long!!}
    jwt:
      # Must be long enough for HS256 (>=32 bytes).
      # In production, set via env/secret manager.
      secret: ${APP_JWT_SECRET:change-this-dev-secret-key-change-this}
      issuer: jira-agentic-ai
      expires-minutes: 120
  attachments:
    # PoC default: use local MinIO (S3-compatible) for attachment storage.
    storage: s3
    # Kept for fallback when storage=local.
    dir: ${user.home}/.jira-agentic-ai/attachments
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: jira-attachments
      access-key: minioadmin
      secret-key: minioadmin
      path-style-access: true

  github:
    # GitHub Personal Access Token used to enrich code link metadata
    # (PR / commit title, state, author) and to scan repos for issue
    # references. Optional — without it we fall back to anonymous public
    # API calls (60 req/hour, public repos only).
    #
    # Per-space override: bulk-importing repos with a PAT stores it on spaces.github_pat
    # (never returned by the API) and is used for Scan / Refresh in that space before this global token.
    #
    # Private repositories:
    #   • Org: token must have access to that org (classic: "repo"; fine-grained: org + repo contents/metadata as needed).
    #   • Your own user: bulk import uses /user/repos when the imported login matches this token's user — needs "repo" (classic) or fine-grained access to the repos.
    #   • Someone else's user account: GitHub only lists their *public* repos via API — private repos of other users cannot be bulk-listed.
    #
    # Recommended: do NOT hard-code your token here. Export it once in
    # your shell rc (~/.zshrc) and it will flow through automatically:
    #   export GITHUB_TOKEN=github_pat_xxx
    # For ad-hoc overrides you can also set APP_GITHUB_TOKEN.
    token: ${APP_GITHUB_TOKEN:${GITHUB_TOKEN:}}
